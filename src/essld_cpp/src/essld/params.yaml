header_include_path: essld_cpp/essld_cpp.hpp
namespace: essld_cpp
node_class_name: ESSLD

params:
  autostart:
    type: bool
    default_value: true
    description: "Whether to process incoming images immediately."
    constraints: "Cannot be changed."
    read_only: true
    var_name: autostart_

  verbose:
    type: bool
    default_value: false
    description: "Flag for printing per-frame information."
    constraints: "Cannot be changed."
    read_only: true
    var_name: verbose_

  publish_annotated:
    type: bool
    default_value: true
    description: "Whether to publish annotated images with the detected sea-sky line."
    constraints: "Cannot be changed."
    read_only: true
    var_name: publish_annotated_

  publish_mask:
    type: bool
    default_value: false
    description: "Whether to publish the thresholded segmentation mask."
    constraints: "Cannot be changed."
    read_only: true
    var_name: publish_mask_

  subscribers.topic_name.image:
    type: string
    default_value: "/camera/image_rect_color"
    description: "Input image topic name."
    constraints: "Cannot be changed."
    read_only: true
    var_name: subscribers_topic_name_image_

  subscribers.best_effort_qos:
    type: bool
    default_value: false
    description: "Whether to subscribe to images with best-effort QoS."
    constraints: "Cannot be changed."
    read_only: true
    var_name: subscribers_best_effort_qos_

  subscribers.depth:
    type: integer
    default_value: 30
    min_value: 1
    max_value: 1000
    step: 1
    description: "Image subscriber queue depth."
    constraints: "Cannot be changed."
    read_only: true
    var_name: subscribers_depth_

  subscribers.transport:
    type: string
    default_value: "raw"
    description: "image_transport transport type."
    constraints: "Cannot be changed."
    read_only: true
    var_name: subscribers_transport_

  output.states_csv:
    type: string
    default_value: ""
    description: "Optional path for detected sea-sky line states CSV."
    constraints: "Cannot be changed."
    read_only: true
    var_name: output_states_csv_

  output.frame_timing_csv:
    type: string
    default_value: ""
    description: "Optional path for per-frame execution time CSV."
    constraints: "Cannot be changed."
    read_only: true
    var_name: output_frame_timing_csv_

  model.engine_path:
    type: string
    default_value: ""
    description: "Absolute path to the TensorRT .engine file (DCEUNet, e.g. tools/ESSLD/weights/dceunetex_fp16.engine). Mandatory: the node fails to start if empty or unreadable."
    constraints: "Cannot be changed. Engines are locked to the GPU/driver/TensorRT build used to create them."
    read_only: true
    var_name: model_engine_path_

  model.gpu_id:
    type: integer
    default_value: 0
    min_value: 0
    max_value: 15
    step: 1
    description: "CUDA device index to run inference on."
    constraints: "Cannot be changed."
    read_only: true
    var_name: model_gpu_id_

  model.input_width:
    type: integer
    default_value: 512
    min_value: 32
    max_value: 4096
    step: 1
    description: "Model input width in pixels. Must match the engine's bound input tensor shape."
    constraints: "Cannot be changed."
    read_only: true
    var_name: model_input_width_

  model.input_height:
    type: integer
    default_value: 256
    min_value: 32
    max_value: 4096
    step: 1
    description: "Model input height in pixels. Must match the engine's bound input tensor shape."
    constraints: "Cannot be changed."
    read_only: true
    var_name: model_input_height_

  mask_threshold:
    type: double
    default_value: 0.5
    min_value: 0.0
    max_value: 1.0
    step: 0.01
    description: "Sigmoid probability threshold used to binarize the segmentation mask."
    constraints: "Cannot be changed."
    read_only: true
    var_name: mask_threshold_

  fusion.median_filter_sizes:
    type: integer_array
    default_value:
      - 1
      - 5
      - 7
    min_value: 1
    max_value: 31
    step: 2
    description: "Median filter kernel sizes (must be odd) for the multi-scale Canny fusion."
    constraints: "Cannot be changed."
    read_only: true
    var_name: fusion_median_filter_sizes_

  fusion.canny_fusion_weights:
    type: double_array
    default_value:
      - 0.5
      - 0.3
      - 0.2
    min_value: 0.0
    max_value: 1.0
    step: 0.01
    description: "Weights for fusing edges from each median_filter_sizes scale. Must have the same length."
    constraints: "Cannot be changed."
    read_only: true
    var_name: fusion_canny_fusion_weights_

  fusion.confidence_map_sigmas:
    type: double_array
    default_value:
      - 10.0
      - 15.0
      - 20.0
    min_value: 0.1
    max_value: 200.0
    step: 0.1
    description: "Sigmas of the Gaussian spatial confidence maps centered on the ROI midline."
    constraints: "Cannot be changed."
    read_only: true
    var_name: fusion_confidence_map_sigmas_

  fusion.confidence_map_weights:
    type: double_array
    default_value:
      - 0.5
      - 0.3
      - 0.2
    min_value: 0.0
    max_value: 1.0
    step: 0.01
    description: "Weights for fusing confidence maps from each confidence_map_sigmas scale. Must have the same length."
    constraints: "Cannot be changed."
    read_only: true
    var_name: fusion_confidence_map_weights_

  fusion.fused_map_final_threshold:
    type: integer
    default_value: 60
    min_value: 0
    max_value: 255
    step: 1
    description: "Threshold on the fused, non-max-suppressed confidence map (0-255 scale) used to generate RANSAC candidate points."
    constraints: "Cannot be changed."
    read_only: true
    var_name: fusion_fused_map_final_threshold_

  fusion.hough_threshold:
    type: integer
    default_value: 50
    min_value: 1
    max_value: 1000
    step: 1
    description: "OpenCV HoughLinesP vote threshold used by the linearity filter."
    constraints: "Cannot be changed."
    read_only: true
    var_name: fusion_hough_threshold_

  fusion.hough_min_line_length:
    type: integer
    default_value: 60
    min_value: 0
    max_value: 2000
    step: 1
    description: "OpenCV HoughLinesP minimum line length."
    constraints: "Cannot be changed."
    read_only: true
    var_name: fusion_hough_min_line_length_

  fusion.hough_max_line_gap:
    type: integer
    default_value: 100
    min_value: 0
    max_value: 2000
    step: 1
    description: "OpenCV HoughLinesP maximum line gap."
    constraints: "Cannot be changed."
    read_only: true
    var_name: fusion_hough_max_line_gap_

  fusion.grad_score:
    type: double
    default_value: 80.0
    min_value: 0.0
    max_value: 255.0
    step: 1.0
    description: "Gradient score used to compute the dynamic ROI padding around the coarse line."
    constraints: "Cannot be changed."
    read_only: true
    var_name: fusion_grad_score_

  smoothing.alpha:
    type: double
    default_value: 0.7
    min_value: 0.0
    max_value: 1.0
    step: 0.01
    description: "Exponential smoothing weight given to the current frame's detection (1-alpha is given to the previous state)."
    constraints: "Cannot be changed."
    read_only: true
    var_name: smoothing_alpha_

  smoothing.hold_last_on_failure:
    type: bool
    default_value: true
    description: "Whether to keep publishing the last valid state when a frame's detection fails."
    constraints: "Cannot be changed."
    read_only: true
    var_name: smoothing_hold_last_on_failure_
