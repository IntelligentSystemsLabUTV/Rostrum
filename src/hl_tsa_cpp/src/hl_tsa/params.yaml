header_include_path: hl_tsa_cpp/hl_tsa_cpp.hpp
namespace: hl_tsa_cpp
node_class_name: HLTSA

params:
  autostart:
    type: bool
    default_value: true
    description: "Whether to process incoming images immediately."
    constraints: "Cannot be changed."
    read_only: true
    var_name: autostart_

  verbose:
    type: bool
    default_value: false
    description: "Flag for printing per-frame information."
    constraints: "Cannot be changed."
    read_only: true
    var_name: verbose_

  publish_annotated:
    type: bool
    default_value: false
    description: "Whether to publish annotated images with horizon and ROI overlays."
    constraints: "Cannot be changed."
    read_only: true
    var_name: publish_annotated_

  subscribers.topic_name.image:
    type: string
    default_value: "/camera/image_rect_color"
    description: "Input image topic name."
    constraints: "Cannot be changed."
    read_only: true
    var_name: subscribers_topic_name_image_

  subscribers.best_effort_qos:
    type: bool
    default_value: false
    description: "Whether to subscribe to images with best-effort QoS."
    constraints: "Cannot be changed."
    read_only: true
    var_name: subscribers_best_effort_qos_

  subscribers.depth:
    type: integer
    default_value: 100
    min_value: 1
    max_value: 1000
    step: 1
    description: "Image subscriber queue depth."
    constraints: "Cannot be changed."
    read_only: true
    var_name: subscribers_depth_

  subscribers.transport:
    type: string
    default_value: "raw"
    description: "image_transport transport type."
    constraints: "Cannot be changed."
    read_only: true
    var_name: subscribers_transport_

  output.states_csv:
    type: string
    default_value: ""
    description: "Optional path for detected horizon states CSV."
    constraints: "Cannot be changed."
    read_only: true
    var_name: output_states_csv_

  output.frame_timing_csv:
    type: string
    default_value: ""
    description: "Optional path for per-frame execution time CSV."
    constraints: "Cannot be changed."
    read_only: true
    var_name: output_frame_timing_csv_

  listener_frames:
    type: integer
    default_value: 16
    min_value: 1
    max_value: 1000
    step: 1
    description: "Number of listener-block frames."
    constraints: "Cannot be changed."
    read_only: true
    var_name: listener_frames_

  max_iterations:
    type: integer
    default_value: 3
    min_value: 0
    max_value: 20
    step: 1
    description: "Maximum number of control-loop ROI retries."
    constraints: "Cannot be changed."
    read_only: true
    var_name: max_iterations_

  zscore:
    type: double
    default_value: 1.96
    min_value: 0.0
    max_value: 10.0
    step: 0.01
    description: "Z-score used to scale forecast uncertainty."
    constraints: "Cannot be changed."
    read_only: true
    var_name: zscore_

  canny_low:
    type: integer
    default_value: 20
    min_value: 0
    max_value: 255
    step: 1
    description: "Canny low threshold."
    constraints: "Cannot be changed."
    read_only: true
    var_name: canny_low_

  canny_high:
    type: integer
    default_value: 60
    min_value: 0
    max_value: 255
    step: 1
    description: "Canny high threshold."
    constraints: "Cannot be changed."
    read_only: true
    var_name: canny_high_

  area_open_fraction:
    type: double
    default_value: 0.005
    min_value: 0.0
    max_value: 1.0
    step: 0.001
    description: "Minimum connected-component edge area as a fraction of edge pixels."
    constraints: "Cannot be changed."
    read_only: true
    var_name: area_open_fraction_

  hough_threshold:
    type: integer
    default_value: 15
    min_value: 1
    max_value: 10000
    step: 1
    description: "OpenCV HoughLines vote threshold."
    constraints: "Cannot be changed."
    read_only: true
    var_name: hough_threshold_

  hough_theta_resolution_deg:
    type: double
    default_value: 0.25
    min_value: 0.01
    max_value: 5.0
    step: 0.01
    description: "Hough theta resolution in degrees."
    constraints: "Cannot be changed."
    read_only: true
    var_name: hough_theta_resolution_deg_

  max_abs_horizon_angle_deg:
    type: double
    default_value: 35.0
    min_value: 0.0
    max_value: 90.0
    step: 0.1
    description: "Maximum absolute line angle considered plausible for the horizon."
    constraints: "Cannot be changed."
    read_only: true
    var_name: max_abs_horizon_angle_deg_

  min_roi_height_fraction:
    type: double
    default_value: 0.075
    min_value: 0.0
    max_value: 1.0
    step: 0.001
    description: "Minimum rectangular ROI half-height as a fraction of image height."
    constraints: "Cannot be changed."
    read_only: true
    var_name: min_roi_height_fraction_

  error_band_fraction:
    type: double
    default_value: 0.025
    min_value: 0.0
    max_value: 1.0
    step: 0.001
    description: "Histogram error band half-height as a fraction of image height."
    constraints: "Cannot be changed."
    read_only: true
    var_name: error_band_fraction_

  min_y_sd:
    type: double
    default_value: 2.0
    min_value: 0.0
    max_value: 1000.0
    step: 0.1
    description: "Minimum forecast standard deviation for y."
    constraints: "Cannot be changed."
    read_only: true
    var_name: min_y_sd_

  min_theta_sd:
    type: double
    default_value: 0.25
    min_value: 0.0
    max_value: 90.0
    step: 0.01
    description: "Minimum forecast standard deviation for theta."
    constraints: "Cannot be changed."
    read_only: true
    var_name: min_theta_sd_
